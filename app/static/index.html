<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT Service Portal</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><strong>IT SERVICE PORTAL</strong><span>Simple support for our people</span></div><a href="/admin.html">Staff console →</a></header>
<main><section class="intro"><p class="eyebrow">SELF SERVICE</p><h1>How can IT help?</h1><p>Submit an incident, request, or change. Your ticket is saved immediately and sent to the right support group.</p></section>
<form id="ticketForm"><div class="card"><h2>1. Choose a service</h2><label>Service category<select name="category" id="category" required></select></label><p id="route" class="route"></p></div>
<div class="card"><h2>2. Tell us more</h2><div class="grid"><label>Your name<input name="requester_name" required maxlength="160" placeholder="Jane Tan"></label><label>Work email<input name="requester_email" type="email" required placeholder="jane@example.com"></label><label>Entity / location<input name="entity" placeholder="Singapore"></label><label>Department<input name="department" placeholder="Finance"></label></div><div id="approval" class="grid hidden"><label>Approver name/title<input name="approval_name" placeholder="John Smith, IT HOD"></label><label>Approver email<input name="approval_email" type="email" placeholder="john@example.com"></label></div><div class="grid"><label>Priority<select name="priority"><option value="P4">P4 — low / planned</option><option value="P3" selected>P3 — normal</option><option value="P2">P2 — high</option><option value="P1">P1 — critical</option></select></label><label>Subject<input name="subject" required maxlength="300" placeholder="Briefly describe what you need"></label></div><label>Description<textarea name="description" required rows="8" placeholder="Describe the request, impact, error, and who is affected."></textarea></label><label>Attachments (maximum 10 MB each)<input name="files" type="file" multiple></label></div>
<button type="submit">Submit ticket</button><p id="message" role="status"></p></form></main><script src="/portal.js"></script></body></html>
